name: Build
on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Go vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  release:
    name: Release build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-386
          - linux-arm64
          - android-arm64
          - windows-amd64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Resolve version
        id: version
        run: |
          VER="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD 2>/dev/null || echo dev)"
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build release binary
        run: |
          # export so the go toolchain (a child process) actually sees them;
          # plain assignment only affects the file name in this shell and go
          # would build every target as the runner's default GOOS/GOARCH.
          export GOOS="${TARGET%-*}"
          export GOARCH="${TARGET#*-}"
          DATE="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          LDFLAGS="-w -s -X \"github.com/librespeed/speedtest-cli/defs.ProgName=librespeed-cli\" -X \"github.com/librespeed/speedtest-cli/defs.ProgVersion=${VER}\" -X \"github.com/librespeed/speedtest-cli/defs.BuildDate=${DATE}\""
          EXE=""
          [ "${GOOS}" = "windows" ] && EXE=".exe"
          mkdir -p out
          # Package mode, not file mode: `go build main.go` would silently ignore
          # any other file added to package main.
          go build -o "out/librespeed-cli-${GOOS}-${GOARCH}${EXE}" -ldflags "${LDFLAGS}" -trimpath .
        env:
          # Never inherit cgo: a native target would link the runner's glibc,
          # and android/arm64 would need the NDK. Keep every artifact a static,
          # pure-Go binary so all targets behave the same on the wire.
          CGO_ENABLED: "0"
          TARGET: ${{ matrix.target }}
          VER: ${{ steps.version.outputs.VER }}
      - name: Verify artifact matches its target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          EXE=""
          [ "${TARGET%%-*}" = "windows" ] && EXE=".exe"
          BIN="out/librespeed-cli-${TARGET}${EXE}"
          go version -m "${BIN}" | sed -n '1p;/^[[:space:]]*build/p'
          go version -m "${BIN}" | grep -q "GOOS=${TARGET%-*}$" || { echo "::error file=${BIN}::GOOS does not match target ${TARGET}"; exit 1; }
          go version -m "${BIN}" | grep -q "GOARCH=${TARGET#*-}$" || { echo "::error file=${BIN}::GOARCH does not match target ${TARGET}"; exit 1; }

      - name: Smoke test
        if: matrix.target == 'linux-amd64'
        run: ./out/librespeed-cli-linux-amd64 --version
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: librespeed-cli-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: release
    # A push to any branch used to cut a release; only master should.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        run: |
          VER="$(date -u +'%Y.%m.%d')-$(git rev-parse --short HEAD 2>/dev/null || echo dev)"
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package and checksum
        run: |
          mkdir -p release
          cp -f dist/* release/
          (cd release && sha256sum * | tee SHA256SUMS.txt)
      - name: Check release exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.VER }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VER }}
          name: v${{ steps.version.outputs.VER }}
          body: |
            Auto-built release from push to master.
            - Version: v${{ steps.version.outputs.VER }}
            - Platforms: linux (amd64/386/arm64), android (arm64), windows (amd64), darwin (amd64/arm64)
            - Checksums: see SHA256SUMS.txt
          files: release/*

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build image
        run: docker build -t librespeed-cli .
      - name: Smoke test image
        run: docker run --rm librespeed-cli --version
